[project]
name = "weather-data-api"
version = "0.1.0"
description = "Managing External APIs in fastapi"
readme = "README.md"
authors = [
    { name = "Amirali Abbasi", email = "abbasigudarzi@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "datetime>=6.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.1",
]

[project.scripts]
weather-data-api = "weather_data_api:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
